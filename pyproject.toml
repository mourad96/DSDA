[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsda"
version = "0.1.0"
description = "Deterministic Spatial Disambiguation Algorithm (DSDA) for crash linear referencing"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "DSDA Research Team" }
]
dependencies = [
    "jellyfish>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
